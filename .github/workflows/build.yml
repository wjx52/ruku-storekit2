name: Build Theos DEB
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          set -e
          brew install ldid make
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -sLO https://github.com/theos/sdks/archive/master.tar.gz
          TMP=$(mktemp -d)
          tar -xzf master.tar.gz -C $TMP
          cp -a $TMP/sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || true
          rm -rf master.tar.gz $TMP
      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: ruku-storekit2-deb
          path: packages/*.deb
          if-no-files-found: error
